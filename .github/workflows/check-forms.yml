name: Site checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reject placeholder forms and missing assets
        run: node scripts/check-forms.js
      - name: Test lead payload with mocked fetch
        run: node scripts/test-leads.js
